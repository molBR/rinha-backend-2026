services:
  lb:
    image: molbr/rinha-backend-2026-lb:latest
    environment:
      - WORKER_SOCKETS=/sockets/lb-ctrl-1.sock,/sockets/lb-ctrl-2.sock
      - LISTEN_ADDR=:9999
    volumes:
      - sockets:/sockets
    ports:
      - "9999:9999"
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: "30MB"
    restart: unless-stopped

  api1:
    image: molbr/rinha-backend-2026:v5x5-3m
    environment:
      - PORT=8080
      - GOMAXPROCS=1
      - CTRL_SOCKET=/sockets/lb-ctrl-1.sock
    volumes:
      - sockets:/sockets
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "140MB"
    restart: unless-stopped

  api2:
    image: molbr/rinha-backend-2026:v5x5-3m
    environment:
      - PORT=8080
      - GOMAXPROCS=1
      - CTRL_SOCKET=/sockets/lb-ctrl-2.sock
    volumes:
      - sockets:/sockets
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "140MB"
    restart: unless-stopped

volumes:
  sockets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
