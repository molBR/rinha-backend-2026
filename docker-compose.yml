services:
  lb:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "9999:9999"
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: "30MB"
    restart: unless-stopped

  api1:
    image: molbr/rinha-backend-2026:latest
    environment:
      - PORT=8080
      - GOMAXPROCS=1
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "140MB"
    restart: unless-stopped

  api2:
    image: molbr/rinha-backend-2026:latest
    environment:
      - PORT=8080
      - GOMAXPROCS=1
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "140MB"
    restart: unless-stopped
