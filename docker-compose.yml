services:
  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "9999:9999"
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: "30MB"

  api1:
    build: .
    environment:
      - PORT=8080
      - GOMAXPROCS=1
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "140MB"

  api2:
    build: .
    environment:
      - PORT=8080
      - GOMAXPROCS=1
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "140MB"
